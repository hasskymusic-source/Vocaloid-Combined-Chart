name: 01_Monday_Snapshot_and_Draft

on:
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch API metrics & Build weekly draft
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TZ: 'Asia/Tokyo'
        run: |
          python backend/fetch_metrics.py
          python backend/build_draft.py

      - name: Commit and push draft data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ data/drafts/
          git diff --staged --quiet || git commit -m "chore(data): update Monday snapshot and weekly draft"
          git push